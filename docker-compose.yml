services:
  postgres:
    image: postgres:15-alpine
    container_name: shop_inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: shop_inventory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
